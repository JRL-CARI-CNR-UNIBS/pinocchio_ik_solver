pinocchio_ik:
  type: ik_solver/PinocchioIkSolver
  base_frame: base_link    # base frame of the chain
  flange_frame: tool0      # end frame of the chain
  tool_frame: tool0        # destination frame of the IK (rigidly attached to flange_frame)
  joint_names:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - elbow_joint
  - wrist_1_joint
  - wrist_2_joint
  - wrist_3_joint

  desired_solutions: 8     # distinct solutions (modulo 2pi) to look for
  min_stall_iterations: 50 # attempts without a new solution before stopping, once one is found
  max_stall_iterations: 300 # attempts without a new solution before stopping, if none is found

  # Pinocchio solver (optional, defaults shown)
  translation_tolerance: 1.0e-5   # [m]
  rotation_tolerance: 1.0e-4      # [rad]
  max_iterations_per_attempt: 100
  damping: 1.0e-3                 # initial Levenberg-Marquardt damping
  max_step: 0.5                   # max norm of a joint step
  duplicate_tolerance: 1.0e-3     # two solutions closer than this (modulo 2pi) are the same
  max_attempts: 100000
  random_seed: -1                 # -1: random

  # Values of URDF joints that are not in joint_names (default 0)
  # locked_joints:
  #   finger_joint: 0.0
